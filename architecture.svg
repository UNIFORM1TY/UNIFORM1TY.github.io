<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="880" viewBox="0 0 1080 880" fill="none" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Uniformity runtime topology">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L8,3.2 z" fill="#71717a"/>
    </marker>
    <marker id="ars" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L8,3.2 z" fill="#c4c4c8"/>
    </marker>
    <linearGradient id="accent" x1="0" y1="0" x2="1080" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="880" fill="#ffffff"/>

  <text x="56" y="58" font-size="11.5" font-weight="700" letter-spacing="3" fill="#71717a">RUNTIME TOPOLOGY</text>
  <text x="56" y="82" font-size="13" fill="#a1a1aa">Governed evidence in · advisory assessment out · authority never crosses the boundary</text>
  <rect x="56" y="100" width="968" height="1.5" fill="url(#accent)"/>

  <!-- ===== UNIFORMITY OS ===== -->
  <rect x="196" y="136" width="688" height="152" rx="14" fill="#fafafa" stroke="#0a0a0b" stroke-width="1.6"/>
  <text x="540" y="172" font-size="15" font-weight="700" letter-spacing="1.6" fill="#0a0a0b" text-anchor="middle">UNIFORMITY OS</text>
  <text x="540" y="192" font-size="11.5" fill="#71717a" text-anchor="middle">the operating system / composition layer — owns no domain semantics</text>
  <g font-size="11" font-weight="500">
    <rect x="226" y="212" width="200" height="30" rx="7" fill="#ffffff" stroke="#e7e7ea"/>
    <text x="326" y="232" fill="#3f3f46" text-anchor="middle">Store + immutable events</text>
    <rect x="440" y="212" width="200" height="30" rx="7" fill="#ffffff" stroke="#e7e7ea"/>
    <text x="540" y="232" fill="#3f3f46" text-anchor="middle">Runtime contract</text>
    <rect x="654" y="212" width="200" height="30" rx="7" fill="#ffffff" stroke="#e7e7ea"/>
    <text x="754" y="232" fill="#3f3f46" text-anchor="middle">Role / context projection</text>
  </g>
  <text x="540" y="270" font-size="10.5" font-family="ui-monospace,Consolas,monospace" fill="#a1a1aa" text-anchor="middle">Object → State → Signal → Evidence → Intelligence → Action → Verification → History</text>

  <!-- evidence package -->
  <path d="M540 288 L540 344" stroke="#71717a" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="368" y="302" width="344" height="30" rx="15" fill="#ffffff" stroke="#e7e7ea"/>
  <text x="540" y="322" font-size="11" fill="#3f3f46" text-anchor="middle">governed evidence package (filtered before the call)</text>

  <!-- ===== FRIDGE BRAIN ===== -->
  <rect x="286" y="352" width="508" height="126" rx="14" fill="#fafafa" stroke="#0a0a0b" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="540" y="386" font-size="14" font-weight="700" letter-spacing="1.4" fill="#0a0a0b" text-anchor="middle">FRIDGE BRAIN</text>
  <text x="540" y="406" font-size="11.5" fill="#71717a" text-anchor="middle">separate advisory intelligence service · HTTP + deterministic fallback</text>
  <g font-size="10.5" fill="#3f3f46">
    <rect x="316" y="422" width="220" height="26" rx="6" fill="#ffffff" stroke="#e7e7ea"/>
    <text x="426" y="439" fill="#3f3f46" text-anchor="middle">may: interpret · rank · cite · propose</text>
    <rect x="552" y="422" width="212" height="26" rx="6" fill="#ffffff" stroke="#e7e7ea"/>
    <text x="658" y="439" fill="#a1a1aa" text-anchor="middle">never: mutate · accept · write history</text>
  </g>

  <!-- assessment only -->
  <path d="M540 478 L540 534" stroke="#71717a" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="396" y="492" width="288" height="30" rx="15" fill="#ffffff" stroke="#e7e7ea"/>
  <text x="540" y="512" font-size="11" fill="#3f3f46" text-anchor="middle">advisory assessment only — exactly one proposed next action</text>

  <!-- ===== INSTRUMENT DOMAIN ===== -->
  <rect x="196" y="542" width="688" height="150" rx="14" fill="#fafafa" stroke="#0a0a0b" stroke-width="1.6"/>
  <text x="540" y="578" font-size="15" font-weight="700" letter-spacing="1.4" fill="#0a0a0b" text-anchor="middle">LOGARHYTHM / SUBANGEL</text>
  <text x="540" y="598" font-size="11.5" fill="#71717a" text-anchor="middle">one instrument world — public identity + archive, diagnostics, repair, service history</text>
  <g font-size="10.5">
    <rect x="226" y="618" width="150" height="30" rx="7" fill="#ffffff" stroke="#e7e7ea"/>
    <text x="301" y="637" fill="#3f3f46" text-anchor="middle">Matt · technical</text>
    <rect x="388" y="618" width="150" height="30" rx="7" fill="#ffffff" stroke="#e7e7ea"/>
    <text x="463" y="637" fill="#3f3f46" text-anchor="middle">Susanna · operational</text>
    <rect x="550" y="618" width="150" height="30" rx="7" fill="#ffffff" stroke="#e7e7ea"/>
    <text x="625" y="637" fill="#3f3f46" text-anchor="middle">Customer · safe status</text>
    <rect x="712" y="618" width="150" height="30" rx="7" fill="#ffffff" stroke="#e7e7ea"/>
    <text x="787" y="637" fill="#3f3f46" text-anchor="middle">Logarhythm · public</text>
  </g>
  <text x="540" y="676" font-size="10.5" font-family="ui-monospace,Consolas,monospace" fill="#a1a1aa" text-anchor="middle">all four projections resolve the same canonical object_id</text>

  <!-- JUNO reference object -->
  <rect x="742" y="572" width="0" height="0" fill="none"/>
  <rect x="56" y="560" width="118" height="112" rx="12" fill="#ffffff" stroke="#e7e7ea"/>
  <text x="115" y="588" font-size="11" font-weight="700" letter-spacing="1" fill="#3f3f46" text-anchor="middle">JUNO-106</text>
  <text x="115" y="608" font-size="10" fill="#a1a1aa" text-anchor="middle">reference object</text>
  <text x="115" y="624" font-size="10" fill="#a1a1aa" text-anchor="middle">proves the runtime</text>
  <text x="115" y="646" font-size="10" font-weight="600" fill="#0ea5e9" text-anchor="middle">not a product</text>

  <!-- separate adapters -->
  <rect x="906" y="560" width="118" height="112" rx="12" fill="#ffffff" stroke="#e7e7ea"/>
  <text x="965" y="588" font-size="11" font-weight="700" letter-spacing="1" fill="#3f3f46" text-anchor="middle">RESELL · UCMR</text>
  <text x="965" y="608" font-size="10" fill="#a1a1aa" text-anchor="middle">separate domain</text>
  <text x="965" y="624" font-size="10" fill="#a1a1aa" text-anchor="middle">adapters</text>
  <text x="965" y="646" font-size="10" font-weight="600" fill="#0ea5e9" text-anchor="middle">same contract</text>

  <!-- Hermes + Nous -->
  <rect x="196" y="716" width="688" height="62" rx="12" fill="#ffffff" stroke="#e7e7ea"/>
  <text x="540" y="742" font-size="12" font-weight="600" fill="#3f3f46" text-anchor="middle">Hermes + Nous — research / operator cross-reference</text>
  <text x="540" y="762" font-size="10.5" fill="#a1a1aa" text-anchor="middle">governed execution support · not product truth</text>

  <text x="56" y="826" font-size="10.5" fill="#a1a1aa">Technical boundaries stay explicit even when the experience feels seamless. The OS composes; the domains remain real.</text>
  <text x="56" y="848" font-size="10.5" font-family="ui-monospace,Consolas,monospace" fill="#c4c4c8">POST /v1/assessments  ·  GET /health  ·  transport: service | fallback</text>
</svg>
