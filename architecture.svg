<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" fill="none" font-family="Inter,Segoe UI,Helvetica Neue,Arial,sans-serif" role="img" aria-label="Uniformity architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#060910"/><stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="core" x1="400" y1="240" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.20"/><stop offset="1" stop-color="#a855f7" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="flowline" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0"/><stop offset="0.5" stop-color="#22d3ee"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.4"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L8,3.2 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowi" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L8,3.2 z" fill="#6366f1"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect width="1200" height="760" fill="url(#grid)"/>

  <text x="60" y="66" font-size="13" font-weight="700" letter-spacing="3" fill="#22d3ee">UNIFORMITY ARCHITECTURE</text>
  <text x="60" y="94" font-size="12" fill="#64748b">One coordination backbone · separate domain owners · versioned contracts</text>
  <rect x="60" y="112" width="1080" height="2" fill="url(#flowline)"/>

  <!-- ============ COORDINATION CORE ============ -->
  <rect x="330" y="176" width="540" height="212" rx="18" fill="url(#core)" stroke="#6366f1" stroke-width="2"/>
  <text x="600" y="212" font-size="17" font-weight="800" letter-spacing="1.4" fill="#f8fafc" text-anchor="middle">UNIFORMITY OS</text>
  <text x="600" y="234" font-size="11.5" fill="#94a3b8" text-anchor="middle">coordination backbone · owns no product domain</text>

  <g font-size="10.5" font-weight="600">
    <rect x="360" y="256" width="152" height="34" rx="8" fill="#0e1526" stroke="#1e293b"/>
    <text x="436" y="277" fill="#c7d2fe" text-anchor="middle">identity + permissions</text>
    <rect x="524" y="256" width="152" height="34" rx="8" fill="#0e1526" stroke="#1e293b"/>
    <text x="600" y="277" fill="#c7d2fe" text-anchor="middle">shared object state</text>
    <rect x="688" y="256" width="152" height="34" rx="8" fill="#0e1526" stroke="#1e293b"/>
    <text x="764" y="277" fill="#c7d2fe" text-anchor="middle">evidence + provenance</text>

    <rect x="360" y="302" width="152" height="34" rx="8" fill="#0e1526" stroke="#1e293b"/>
    <text x="436" y="323" fill="#a5f3fc" text-anchor="middle">action + verification</text>
    <rect x="524" y="302" width="152" height="34" rx="8" fill="#0e1526" stroke="#1e293b"/>
    <text x="600" y="323" fill="#a5f3fc" text-anchor="middle">immutable history</text>
    <rect x="688" y="302" width="152" height="34" rx="8" fill="#0e1526" stroke="#1e293b"/>
    <text x="764" y="323" fill="#a5f3fc" text-anchor="middle">role projections</text>
  </g>
  <text x="600" y="366" font-size="10.5" font-family="ui-monospace,Consolas,monospace" fill="#475569" text-anchor="middle">Object → State → Signal → Evidence → Intelligence → Action → Verification → History</text>

  <!-- ============ CONTRACT BUS ============ -->
  <rect x="120" y="440" width="960" height="46" rx="12" fill="#0e1526" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="600" y="469" font-size="12" font-weight="700" letter-spacing="1.6" fill="#22d3ee" text-anchor="middle">VERSIONED CONTRACTS · no shared database · no shared authority</text>

  <!-- core <-> bus -->
  <path d="M600 388 L600 440" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowi)" marker-start="url(#arrowi)"/>
  <path d="M600 486 L600 546" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- ============ DOMAIN OWNERS ============ -->
  <g>
    <!-- RESELL -->
    <rect x="120" y="546" width="292" height="152" rx="14" fill="#0e1526" stroke="#22d3ee" stroke-width="1.6"/>
    <text x="146" y="582" font-size="14.5" font-weight="800" letter-spacing="1.2" fill="#22d3ee">RESELL</text>
    <text x="146" y="602" font-size="10.5" fill="#64748b">owns resale + transaction truth</text>
    <line x1="146" y1="616" x2="386" y2="616" stroke="#1e293b"/>
    <g font-size="10.5" fill="#94a3b8">
      <text x="146" y="638">· stock plane + inventory</text>
      <text x="146" y="658">· orders + fulfilment state</text>
      <text x="146" y="678">· sell flow + decisions</text>
    </g>

    <!-- SUBANGEL -->
    <rect x="454" y="546" width="292" height="152" rx="14" fill="#0e1526" stroke="#a855f7" stroke-width="1.6"/>
    <text x="480" y="582" font-size="14.5" font-weight="800" letter-spacing="1.2" fill="#a855f7">SUBANGEL</text>
    <text x="480" y="602" font-size="10.5" fill="#64748b">owns instrument + service identity</text>
    <line x1="480" y1="616" x2="720" y2="616" stroke="#1e293b"/>
    <g font-size="10.5" fill="#94a3b8">
      <text x="480" y="638">· instrument archive</text>
      <text x="480" y="658">· repair + service history</text>
      <text x="480" y="678">· The Fridge workspace</text>
    </g>

    <!-- FREEBUFF -->
    <rect x="788" y="546" width="292" height="152" rx="14" fill="#0e1526" stroke="#22c55e" stroke-width="1.6"/>
    <text x="814" y="582" font-size="14.5" font-weight="800" letter-spacing="1.2" fill="#22c55e">FREEBUFF</text>
    <text x="814" y="602" font-size="10.5" fill="#64748b">separate SaaS product surface</text>
    <line x1="814" y1="616" x2="1054" y2="616" stroke="#1e293b"/>
    <g font-size="10.5" fill="#94a3b8">
      <text x="814" y="638">· auth + sessions</text>
      <text x="814" y="658">· billing + entitlements</text>
      <text x="814" y="678">· products + users</text>
    </g>
  </g>

  <text x="60" y="736" font-size="10.5" fill="#475569">Each domain adapter consumes the same runtime contract. Authority is never transferred across the boundary.</text>
</svg>
